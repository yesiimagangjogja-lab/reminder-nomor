<script>
var DATA = { dipantau: [], hangus: [], stats: {}, operators: [] };
var STATUS = '';
var SISA_PILIH = '';
var BUCKET = '';
var OPERATOR = '';
var TINDAK = '';
var Q = '';
var SORT = { by: 'sisa', dir: 'asc' };
var SORT_H = { by: 'tgl', dir: 'desc' };
var SORT_S = { by: 'sisa', dir: 'asc' };
var PAGE_SIZE = 25, PAGE_D = 1, PAGE_H = 1, PAGE_S = 1;

function tombolHalaman(cur,pages,fn){
  var list=[],i;
  if(pages<=7){ for(i=1;i<=pages;i++) list.push(i); }
  else {
    list.push(1);
    if(cur>3) list.push('…');
    for(i=Math.max(2,cur-1);i<=Math.min(pages-1,cur+1);i++) list.push(i);
    if(cur<pages-2) list.push('…');
    list.push(pages);
  }
  return list.map(function(p){
    if(p==='…') return '<span class="pg-elip">…</span>';
    return '<button type="button" class="btn btn-sm '+(p===cur?'btn-primary':'btn-outline-secondary')+'"'+(p===cur?' aria-current="page"':'')+' onclick="'+fn+'('+p+')">'+p+'</button>';
  }).join('');
}
function barHalaman(cur,total,pages,fn){
  if(pages<=1) return '<div class="p-2 small text-muted bg-white border-top">'+total+' nomor</div>';
  var from=(cur-1)*PAGE_SIZE+1, to=Math.min(cur*PAGE_SIZE,total);
  var h='<div class="p-2 d-flex justify-content-between align-items-center border-top bg-white flex-wrap gap-2">';
  h+='<span class="small text-muted">tampil '+from+'–'+to+' dari '+total+' nomor</span>';
  h+='<div class="d-flex gap-1 align-items-center pg-num">';
  h+='<button type="button" class="btn btn-sm btn-outline-secondary" '+(cur<=1?'disabled':'')+' onclick="'+fn+'('+(cur-1)+')">&laquo;</button>';
  h+=tombolHalaman(cur,pages,fn);
  h+='<button type="button" class="btn btn-sm btn-outline-secondary" '+(cur>=pages?'disabled':'')+' onclick="'+fn+'('+(cur+1)+')">&raquo;</button>';
  h+='</div></div>';
  return h;
}
function gotoDash(p){ PAGE_D=p; renderList(true); }
function gotoHangus(p){ PAGE_H=p; renderHangus(true); }

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pill(k){var m={aman:'Aman',segera:'Segera',kritis:'Kritis',hangus:'Hangus',belum:'Belum diisi'};return '<span class="pill pill-'+k+'">'+(m[k]||k)+'</span>';}
function sisaTxt(r){if(r.kategori==='belum'||r.sisa===null||r.sisa===undefined)return '<span class="text-muted">-</span>';if(r.sisa<0)return '<span class="text-danger">Lewat '+(-r.sisa)+' hari</span>';if(r.sisa===0)return '<span class="text-danger fw-bold">Hari H</span>';return 'H-'+r.sisa;}
function tglTxt(r){return r.tgl_tenggang?esc(r.tgl_tenggang.split('-').reverse().join('-')):'<span class="text-muted">— belum diisi —</span>';}
function ingetBadge(r){if(!r.diinget)return '';var c={terkirim:'#065F46',gagal:'#991B1B'}[r.diinget]||'#334155';var bg={terkirim:'#D1FAE5',gagal:'#FEE2E2'}[r.diinget]||'#E2E8F0';return ' <span class="badge-inget" style="background:'+bg+';color:'+c+'" title="Pernah tercatat di log pengingat"><i class="bi bi-bookmark-check"></i> tercatat</span>';}
function tindakEfektif(r){ return r.status_tindak || r.status_auto || ''; }
function tindakKerjaSendiri(r){ return !r.status_tindak && !!r.status_auto; }
var TINDAK_LABEL={'':'Belum ada status',perlu:'Perlu ditindak',proses:'Sedang diurus',beres:'Beres'};
function tindakDrop(r){
  var o=[['','Belum ada','Belum dikasih status'],['perlu','Perlu ditindak','Perlu ditindak — belum kamu urus'],['proses','Sedang diurus','Sedang diurus — lagi kamu urus'],['beres','Beres','Beres — sudah kelar']];
  var cur=tindakEfektif(r);
  var tip=(o.filter(function(x){return x[0]===cur;})[0]||o[0])[2];
  if(tindakKerjaSendiri(r)) tip='Terisi otomatis: '+tip+' (belum diketik tangan).';
  return '<select class="form-select form-select-sm tindak-sel" title="'+tip+'" onchange="tindakRowChange('+r.id+',this)">'
    +o.map(function(x){return '<option value="'+x[0]+'" title="'+x[2]+'"'+(cur===x[0]?' selected':'')+'>'+x[1]+(cur===x[0]&&tindakKerjaSendiri(r)?' (otomatis)':'')+'</option>';}).join('')+'</select>';
}
function tindakRowChange(id, sel){
  sel.disabled=true;
  google.script.run.withSuccessHandler(function(){ muat(); if(TAB_AKTIF==='sehat') muatSehat(); }).withFailureHandler(function(e){ sel.disabled=false; gagal(e); }).setStatusTindak(id, sel.value);
}

var TAB_AKTIF='dash';
var TAB_DAFTAR=['dash','nomor','sehat'];
var LIST_BERSIH=false;
function tabTersimpan(){ try{ var t=localStorage.getItem('tab_aktif')||'dash'; return TAB_DAFTAR.indexOf(t)!==-1?t:'dash'; }catch(e){ return 'dash'; } }
function gantiTab(t){
  if(TAB_DAFTAR.indexOf(t)===-1) t='dash';
  TAB_AKTIF=t;
  try{ localStorage.setItem('tab_aktif',t); }catch(e){}
  TAB_DAFTAR.forEach(function(x){document.getElementById('tab-'+x).style.display=(x===t?'':'none');});
  pilihSemua(false);
  document.querySelectorAll('#sidenav .sn-item').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===t);});
  if((t==='dash'||t==='sehat')&&!LIST_BERSIH){ renderList(); renderHangus(); if(typeof hitungBulk==='function')hitungBulk(); LIST_BERSIH=true; }
  if(t==='sehat') muatSehat();
  if(t==='nomor') renderSehatDaftar();
  updateTicker();
}
function terapkanMini(mau){
  document.body.classList.toggle('side-mini',mau);
  var b=document.getElementById('btnSide');
  if(b) b.title=mau?'Tampilkan nama menu':'Sembunyikan nama menu';
  try{ localStorage.setItem('side_mini',mau?'1':'0'); }catch(e){}
}
function toggleSidenav(){ terapkanMini(!document.body.classList.contains('side-mini')); }
(function(){ var m='0'; try{ m=localStorage.getItem('side_mini')||'0'; }catch(e){} if(m==='1') terapkanMini(true); })();

function muat(){
  google.script.run.withSuccessHandler(render).withFailureHandler(gagal).getDashboard();
  google.script.run.withSuccessHandler(function(h){
    var el=document.getElementById('sehatCount');
    if(el){ el.textContent=h.masalah; el.className='badge sn-count '+(h.masalah?'bg-danger':'bg-success'); }
  }).withFailureHandler(function(){}).cekKesehatanData();
}
function gagal(e){tampilAlert('danger','Terjadi kesalahan: '+(e&&e.message?e.message:e));}

var NAMA_HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var NAMA_BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function dua(n){ return (n<10?'0':'')+n; }
function tanggalPanjangId(ymd){
  var p=String(ymd||'').split('-');
  if(p.length!==3) return '';
  return NAMA_HARI[new Date(+p[0],+p[1]-1,+p[2]).getDay()]+', '+(+p[2])+' '+NAMA_BULAN[+p[1]-1]+' '+p[0];
}
function tikJam(){
  var el=document.getElementById('jamHidup'); if(!el) return;
  var n=new Date();
  el.textContent=dua(n.getHours())+'.'+dua(n.getMinutes())+'.'+dua(n.getSeconds());
}
tikJam(); setInterval(tikJam,1000);

function render(d){
  DATA=d||DATA;
  document.getElementById('hariIni').textContent=tanggalPanjangId(DATA.hariIni);
  var nEl=document.getElementById('nomorTabCount');
  if(nEl) nEl.textContent=DATA.dipantau.length;
  var rt=document.getElementById('ringkasTotal');
  if(rt) rt.textContent=DATA.dipantau.length+' nomor dipantau · '+DATA.hangus.length+' udah kedaluwarsa';
  var s=DATA.stats;
  var belumLengkap=DATA.dipantau.filter(function(r){return !r.tgl_tenggang || !(r.penanggungjawab||'').trim();}).length;
  var tiles=[['kritis','Kritis','habis hari ini sampai 3 hari','#DC2626'],
             ['segera','Segera berakhir','habis 4 sampai 7 hari','#D97706'],
             ['perlu','Perlu tindak lanjut','belum selesai diurus','#BE123C'],
             ['belum','Data belum lengkap','tanggal atau PJ masih kosong','#CA8A04']];
  document.getElementById('tiles').innerHTML=tiles.map(function(t){
    var val, on, fn;
    if(t[0]==='perlu'){ val=(s.perlu||0); on=(TINDAK==='perlu'); fn='setTindakFilter()'; }
    else if(t[0]==='belum'){ val=belumLengkap; on=false; fn='lihatBelumLengkap()'; }
    else { val=(s[t[0]]||0); on=(STATUS===t[0]); fn='setStatusFilter(\''+t[0]+'\')'; }
    var sel=on?'outline:2px solid var(--brand)':'';
    return '<div class="col-6 col-md"><div class="tile" style="'+sel+'" onclick="'+fn+'"><div class="lbl">'+t[1]+'</div><div class="num" style="color:'+t[3]+'">'+val+'</div><div class="sub">'+t[2]+'</div></div></div>';
  }).join('');
  ['fOperator','sOperator'].forEach(function(id){
    var sel=document.getElementById(id); if(!sel) return;
    var cur=sel.value;
    sel.innerHTML='<option value="">Semua operator</option>'+DATA.operators.map(function(o){return '<option>'+esc(o)+'</option>';}).join('');
    sel.value=cur||'';
  });
  jadwalInfo();
  LIST_BERSIH=false;
  var ingat=tabTersimpan();
  if(ingat!=='dash'){ gantiTab(ingat); }
  else { renderList(); renderHangus(); if(typeof hitungBulk==='function')hitungBulk(); LIST_BERSIH=true; }
}
function jadwalInfo(){
  var j=DATA.jadwal||{};
  var b=document.getElementById('backupInfo');
  if(b) b.textContent=j.backup_aktif
    ? ('Backup otomatis ke Drive aktif. Terakhir: '+(j.backup_terakhir||'belum ada')+'.')
    : 'Backup otomatis ke Drive belum aktif — nyalakan di Pengaturan.';
}
// Strip bukti: jadwalnya sudah pernah bangun belum, dan hasilnya apa.
function jalTerakhir(j){
  var el=document.getElementById('autoJal'); if(!el) return;
  var h=j.jalan||{};
  if(!j.aktif){
    el.className='sysline off';
    el.innerHTML='<i class="bi bi-exclamation-triangle"></i> Jadwal otomatis belum dipasang — pengingat tidak jalan sendiri. Pasang lewat kartu Jadwal otomatis di menu Pengaturan.';
    return;
  }
  if(!h.terakhir){
    el.className='sysline warn';
    el.innerHTML='<i class="bi bi-alarm"></i> Jadwal otomatis aktif tiap hari '+esc(j.jam)+' WIB, tapi belum pernah tercatat jalan di aplikasi ini.';
    return;
  }
  var bagi=h.terakhir.split(' '); var jamWib=(bagi[1]||'').slice(0,5);
  var isi='<i class="bi bi-check2-circle"></i> Reminder terakhir jalan <span class="sl-waktu">'+esc(tanggalPanjangId(bagi[0]))+', '+esc(jamWib)+' WIB</span>';
  isi+=h.sumber==='otomatis'?' lewat jadwal otomatis':' dijalankan manual';
  isi+=' — '+numero(h.terkirim)+' terkirim';
  if(h.dicatat) isi+=', '+numero(h.dicatat)+' dicatat tanpa kirim';
  if(h.pengingatUlang) isi+=', '+numero(h.pengingatUlang)+' pengingat ulang';
  if(h.eskalasi) isi+=', '+numero(Math.abs(h.eskalasi))+' dilaporkan ke atasan';
  if(h.tertahan) isi+=', '+numero(h.tertahan)+' ditahan karena kuota habis';
  if(h.gagal) isi+=', '+numero(h.gagal)+' gagal';
  if(h.rekap&&h.rekap!=='tidak aktif') isi+=', rekap '+esc(h.rekap);
  if(h.backup&&h.backup!=='tidak aktif') isi+=', backup '+esc(h.backup);
  isi+='.';
  el.className='sysline'+(h.gagal?' warn':' ok');
  el.innerHTML=isi;
}
function numero(n){ return '<span class="sl-angka">'+(n||0)+'</span>'; }

function keTabel(){
  var la=document.getElementById('listArea');
  if(la) la.scrollIntoView({behavior:'smooth',block:'start'});
}
function setSisaPilih(v){ SISA_PILIH=(SISA_PILIH===v?'':v); BUCKET=''; if(TAB_AKTIF!=='dash') gantiTab('dash'); renderList(); if(SISA_PILIH) keTabel(); }
function setStatusFilter(k){STATUS=(k==='total'||STATUS===k)?'':k; var fs=document.getElementById('fStatus'); if(fs)fs.value=STATUS; SISA_PILIH=''; BUCKET=''; TINDAK=''; render(DATA);}
function setTindakFilter(){TINDAK=(TINDAK==='perlu')?'':'perlu'; STATUS=''; var fs=document.getElementById('fStatus'); if(fs)fs.value=''; SISA_PILIH=''; BUCKET=''; render(DATA);}
function sortCol(col){ if(SORT.by===col){SORT.dir=SORT.dir==='asc'?'desc':'asc';} else {SORT.by=col;SORT.dir='asc';} renderList(); }
function sortColH(col){ if(SORT_H.by===col){SORT_H.dir=SORT_H.dir==='asc'?'desc':'asc';} else {SORT_H.by=col;SORT_H.dir='asc';} renderHangus(); }

function urutkan(rows, st){
  st=st||SORT;
  var by=st.by,dir=st.dir==='desc'?-1:1;
  function key(r){
    if(by==='sisa') return r.sisa===null?1e12:r.sisa;
    if(by==='tgl') return r.tgl_tenggang||'';
    if(by==='status') return r.kategori||'';
    if(by==='pj') return (r.penanggungjawab||'').toLowerCase();
    return (r[by]||'').toString().toLowerCase();
  }
  return rows.slice().sort(function(a,b){var ka=key(a),kb=key(b);return ka<kb?-dir:ka>kb?dir:0;});
}

function angkaNomor(s){
  var d=String(s||'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(d.indexOf('62')===0) d='0'+d.substring(2);
  if(d.charAt(0)!=='0') d='0'+d;
  return d.replace(/^0+/,'');
}

function cocokCari(r,q){
  var teks=String(r.nomor||'')+' '+(r.penanggungjawab||'')+' '+(r.operator||'');
  if(teks.toLowerCase().indexOf(q)!==-1) return true;
  var cari=angkaNomor(q);
  return !!cari && angkaNomor(r.nomor).indexOf(cari)!==-1;
}

function saringNomor(rows,F){
  return rows.filter(function(r){
    if(F.status && r.kategori!==F.status) return false;
    if(F.operator && r.operator!==F.operator) return false;
    if(F.range && (r.sisa===null||r.sisa<0||r.sisa>Number(F.range))) return false;
    if(F.sisa && !masukBucket(r,F.sisa)) return false;
    if(F.bucket && !masukRange(r,F.bucket)) return false;
    if(F.tindak && tindakEfektif(r)!==F.tindak) return false;
    if(F.lengkap){
      var tglKosong=!r.tgl_tenggang, pjKosong=!(r.penanggungjawab||'').trim();
      if(F.lengkap==='tgl' && !tglKosong) return false;
      if(F.lengkap==='pj' && !pjKosong) return false;
      if(F.lengkap==='salah1' && !tglKosong && !pjKosong) return false;
    }
    if(F.q && !cocokCari(r,F.q)) return false;
    return true;
  });
}

function renderList(keep){
  if(!keep) PAGE_D=1;
  Q=(document.getElementById('cari').value||'').toLowerCase();
  OPERATOR=document.getElementById('fOperator').value;
  STATUS=document.getElementById('fStatus').value;
  var rangeEl=document.getElementById('fRange'); var RANGE=rangeEl?rangeEl.value:'';
  var rows=saringNomor(DATA.dipantau,{q:Q,operator:OPERATOR,status:STATUS,range:RANGE,sisa:SISA_PILIH,bucket:BUCKET,tindak:TINDAK});
  rows=urutkan(rows);
  var rc=document.getElementById('dashRowCount');
  if(rc) rc.textContent=(rows.length===DATA.dipantau.length)?(rows.length+' nomor'):('menampilkan '+rows.length+' dari '+DATA.dipantau.length);
  if(!rows.length){
    var LBL_ST={aman:'Aman',segera:'Segera',kritis:'Kritis',belum:'Belum diisi'};
    var LBL_TD={perlu:'Perlu ditindak',proses:'Sedang diurus',beres:'Beres'};
    var aktif=[];
    if(Q) aktif.push('cari "'+Q+'"');
    if(OPERATOR) aktif.push('operator '+OPERATOR);
    if(STATUS) aktif.push('status '+(LBL_ST[STATUS]||STATUS));
    if(RANGE) aktif.push('habis ≤ '+RANGE+' hari');
    if(SISA_PILIH) aktif.push('sisa '+(SISA_PILIH==='0'?'hari ini':(SISA_PILIH==='3'?'1-3 hari':'4-7 hari')));
    if(BUCKET) aktif.push(sbLabel(BUCKET));
    if(TINDAK) aktif.push('tindak '+(LBL_TD[TINDAK]||TINDAK));
    var h='<div class="empty">Tidak ada nomor yang cocok.';
    if(aktif.length) h+='<div class="mt-1 small">Yang lagi nyaring: '+esc(aktif.join(' • '))+'</div>';
    if(Q && /[0-9]/.test(Q)){
      var diHangus=(DATA.hangus||[]).filter(function(r){return cocokCari(r,Q);}).length;
      h+='<div class="mt-2">Kamu cari "'+esc(Q)+'". '+(diHangus?'<span class="link" onclick="cariDiHangus()">Nomor itu ada di daftar Hangus ('+diHangus+' yang cocok) — klik buat buka.</span>':'Kalau nomornya sudah lewat masa aktif, dia pindah ke menu <b>Hangus</b>.')+'</div>';
    }
    h+='<div class="mt-2"><button class="btn btn-sm btn-outline-secondary" onclick="resetFilter()"><i class="bi bi-x-lg"></i> Bersihkan filter</button></div></div>';
    document.getElementById('listArea').innerHTML=h;renderSebaran();return;
  }
  var pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE)); if(PAGE_D>pages)PAGE_D=pages;
  var slice=rows.slice((PAGE_D-1)*PAGE_SIZE,PAGE_D*PAGE_SIZE);
  document.getElementById('listArea').innerHTML= tabelLengkap(slice) + barHalaman(PAGE_D,rows.length,pages,'gotoDash');
  updateTicker();
  renderSebaran();
}

function renderHangus(keep){
  if(!keep) PAGE_H=1;
  document.getElementById('hangusCount').textContent=DATA.hangus.length;
  var qEl=document.getElementById('cariHangus'); var q=(qEl&&qEl.value||'').toLowerCase();
  var rows=DATA.hangus.filter(function(r){
    if(q && !cocokCari(r,q)) return false;
    return true;
  });
  rows=urutkan(rows,SORT_H);
  if(!rows.length){document.getElementById('hangusArea').innerHTML='<div class="empty">Tidak ada nomor hangus.</div>';return;}
  var pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE)); if(PAGE_H>pages)PAGE_H=pages;
  var slice=rows.slice((PAGE_H-1)*PAGE_SIZE,PAGE_H*PAGE_SIZE);
  document.getElementById('hangusArea').innerHTML= tabelLengkap(slice,'hangus') + barHalaman(PAGE_H,rows.length,pages,'gotoHangus');
  updateTicker();
}

var COLS=[['nomor','Nomor'],['operator','Operator'],['tgl','Batas Aktif'],['sisa','Sisa'],['pj','Penanggungjawab'],['status','Jatuh tempo']];
function thHtml(mode){
  var st=mode==='hangus'?SORT_H:(mode==='sehat'?SORT_S:SORT);
  var fn=mode==='hangus'?'sortColH':(mode==='sehat'?'sortColS':'sortCol');
  return COLS.map(function(c){var ind=st.by===c[0]?(st.dir==='asc'?' ▲':' ▼'):'';return '<th class="srt" onclick="'+fn+'(\''+c[0]+'\')">'+c[1]+ind+'</th>';}).join('');
}
function tabelLengkap(rows,mode){
  var penuh=(mode==='sehat'||mode==='hangus');
  var h='<div class="tbl-scroll"><table class="table-modern tbl-lengkap"><thead><tr><th class="th-cb" style="width:34px"><input type="checkbox" class="form-check-input mt-0 cbSemua" onchange="pilihSemuaTabel(this)"></th>'+thHtml(mode)+(penuh?'<th>Tindak lanjut</th><th class="th-aksi">Aksi</th>':'')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    var mepet=(r.sisa===null||r.sisa<0)?'':(r.sisa<=1?' mepet-kritis':(r.sisa<=7?' mepet':''));
    h+='<tr class="'+mepet+'"><td class="td-cb"><input type="checkbox" class="form-check-input mt-0 cbRow" value="'+r.id+'" onchange="hitungBulk()"></td>';
    h+='<td data-l="Nomor"><span class="link mono" onclick="bukaDetail('+r.id+')">'+esc(r.nomor)+'</span>'+ingetBadge(r)+'</td><td data-l="Operator">'+esc(r.operator)+'</td><td data-l="Batas aktif">'+tglTxt(r)+'</td><td data-l="Sisa">'+sisaTxt(r)+'</td><td data-l="Penanggungjawab" class="small text-muted">'+esc(r.penanggungjawab)+'</td><td data-l="Jatuh tempo">'+pill(r.kategori)+'</td>';
    if(penuh) h+='<td data-l="Tindak lanjut">'+tindakDrop(r)+'</td><td data-l="Aksi" class="td-aksi"><span class="aksi-gp"><button class="btn btn-sm btn-outline-success" title="Sudah diisi pulsa - catat tanggal aktif baru" onclick="bukaCatat('+r.id+')"><i class="bi bi-calendar-check"></i></button><button class="btn btn-sm btn-outline-primary" title="Edit data" onclick="bukaForm('+r.id+')"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" title="Hapus nomor" onclick="hapusNomor('+r.id+')"><i class="bi bi-trash"></i></button></span></td>';
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

// ---- BULK ----
function idTerpilih(){ var seen={},out=[]; document.querySelectorAll('.cbRow:checked').forEach(function(c){ if(!seen[c.value]){seen[c.value]=1;out.push(c.value);} }); return out; }
function pilihSemua(cek){ document.querySelectorAll('.cbRow').forEach(function(c){c.checked=cek;}); document.querySelectorAll('.cbSemua').forEach(function(c){c.checked=cek;}); hitungBulk(); }
function pilihSemuaTabel(el){ var tb=el.closest('table'); if(!tb)return; var on=el.checked; tb.querySelectorAll('.cbRow').forEach(function(c){c.checked=on;}); if(typeof hitungBulk==='function')hitungBulk(); }
function hitungBulk(){ var n=idTerpilih().length; document.getElementById('bulkCount').textContent=n; document.getElementById('bulkBar').style.display=n?'':'none'; }
function bulkKirim(){
  var ids=idTerpilih(); if(!ids.length)return;
  var b=(typeof event!=='undefined'&&event.target)?event.target.closest('button'):null;

var formModal, FORM_DIRTY=false, FORM_IZIN_TUTUP=false;
var POLA_NOMOR=/^(0|\+?62)[0-9]{7,14}$/;
function cekFormNomor(){
  var i=document.getElementById('f_nomor'), e=document.getElementById('err_nomor');
  if(!i||!e) return true;
  var v=String(i.value||'').replace(/[\s()-]/g,'');
  var ok = !v || POLA_NOMOR.test(v);
  i.classList.toggle('is-invalid',!ok);
  e.textContent = ok ? '' : 'Formatnya belum kebaca. Mulai pakai 08... atau 628..., isinya angka doang.';
  e.style.display = ok ? 'none' : '';
  return ok;
}
function cekFormTanggal(){
  var i=document.getElementById('f_tgl'), e=document.getElementById('err_tgl');
  if(!i||!e) return;
  var msg='';
  if(i.value){
    var batas=new Date(); batas.setHours(0,0,0,0);
    if(new Date(i.value+'T00:00:00') < batas) msg='Tanggal ini udah lewat — nanti nomornya langsung masuk daftar kedaluwarsa.';
  }
  e.textContent=msg; e.style.display = msg ? '' : 'none';
}

var BTN_RUN='<i class="bi bi-send"></i> Jalankan &amp; kirim sekarang';
function jalanReminder(){
  konfirmasi({pesan:'Jalankan pengingat sekarang?\nWA dikirim beneran ke nomor-nomor kantor yang lagi masuk jadwal.',ok:'Jalankan',ikon:'send',tombolIkon:'send'},function(){
    var b=document.getElementById('btnRun');
    if(b){b.disabled=true;b.innerHTML='<i class="bi bi-hourglass-split"></i> Menjalankan...';}
    google.script.run.withSuccessHandler(function(res){
      if(b){b.disabled=false;b.innerHTML=BTN_RUN;}
      var belum=res.diproses-(res.terkirim||0)-(res.gagal||0);
      var msg=res.diproses===0?'Tidak ada yang perlu diingetin hari ini (cek H-'+String(DATA.settings.hari_pengingat).replace(/,/g,'/')+').'
        :res.diproses+' nomor diproses — terkirim '+(res.terkirim||0)+', gagal '+(res.gagal||0)+(belum?', belum terkirim '+belum:'')+(res.nagih?' • pengingat ulang '+res.nagih:'')+'.';
      var h='<div class="alert alert-'+(res.gagal?'warning':'success')+' py-2 mb-2">'+esc(msg)+'</div>';
      if(res.tertahan) h+='<div class="alert alert-warning py-2 mb-2"><i class="bi bi-exclamation-triangle"></i> '+res.tertahan+' pesan <b>ditahan</b> karena kuota harian ('+res.kuota+') sudah habis. Kirim manual lewat tab Kirim Pesan atau naikkan kuota di Pengaturan.</div>';
      if(res.eskalasi>0) h+='<div class="alert alert-light border py-2 mb-2">Laporan '+res.eskalasi+' nomor terlambat dikirim ke nomor rekap atasan.</div>';
      var live=(res.entri||[]).filter(function(e){return e.jenis==='nagih'||e.status==='tertahan'||e.jenis==='eskalasi';});
      if(live.length){
        h+='<table class="table-modern"><thead><tr><th>Nomor</th><th>H-</th><th>Jenis</th><th>Status</th></tr></thead><tbody>';
        live.forEach(function(e){ h+='<tr><td class="mono">'+esc(e.nomor)+'</td><td>'+esc(e.hari_ke)+'</td><td class="small">'+esc(jenisNama(e.jenis))+'</td><td>'+esc(e.status)+'</td></tr>'; });
        h+='</tbody></table>';
      }
      document.getElementById('runResult').innerHTML=h;
      muat();
    }).withFailureHandler(function(e){if(b){b.disabled=false;b.innerHTML=BTN_RUN;}gagal(e);}).jalankanReminder(false);
  });
}

function sisipTpl(id,token){

// ---- KARTU PENGINGAT: ringkasan + daftar nomor yang mau diurus ----
function masukBucket(r, v){
  if(r.sisa===null||r.sisa<0) return false;
  if(v==='0') return r.sisa===0;
  if(v==='3') return r.sisa>=1&&r.sisa<=3;
  if(v==='7') return r.sisa>=4&&r.sisa<=7;
  return true;
}
function samakanTinggi(){
  var lb=document.getElementById('tkList'), seb=document.getElementById('sebaranBody');
  if(!lb||!seb) return;
  var h=Math.round(seb.getBoundingClientRect().height);
  lb.style.maxHeight = (h>120 ? h : 260)+'px';
}
function updateTicker(){
  var el=document.getElementById("ticker"), card=document.getElementById("tkCard"), tr=document.getElementById("tickerTrack"), lb=document.getElementById("tkList");
  if(!el||!tr) return;
  var sembunyi=function(){ el.style.display="none"; if(card) card.style.display="none"; };
  if(!DATA||!DATA.dipantau){ sembunyi(); return; }
  var list=DATA.dipantau.filter(function(r){return masukBucket(r,'7')||masukBucket(r,'3')||masukBucket(r,'0');});
  if(!list.length){ sembunyi(); return; }
  var n0=list.filter(function(r){return r.sisa===0;}).length;
  var n3=list.filter(function(r){return masukBucket(r,'3');}).length;
  var n7=list.length-n0-n3;
  var cls=function(v,extra){ return 'tk-chip'+(extra?' '+extra:'')+(SISA_PILIH===v?' on':''); };
  var chip=function(v,extra,isi,tipe){ return '<button type="button" class="'+cls(v,extra)+'" title="'+tipe+'" onclick="setSisaPilih(\''+v+'\')">'+isi+'</button>'; };
  var h='<span class="tk-ico"><i class="bi bi-bell-fill"></i></span>'
    +'<span class="tk-label">Perlu diurus</span>'
    +'<span class="tk-total"><b>'+list.length+'</b> nomor habis dalam 7 hari</span><span class="tk-div"></span>';
  if(n0) h+=chip('0','panas','<i class="bi bi-exclamation-circle"></i> Hari ini <b>'+n0+'</b>','Klik: tampilkan yang habis hari ini saja');
  if(n3) h+=chip('3','','≤ 3 hari <b>'+n3+'</b>','Klik: tampilkan yang habis 1–3 hari saja');
  if(n7) h+=chip('7','','4–7 hari <b>'+n7+'</b>','Klik: tampilkan yang habis 4–7 hari saja');
  if(SISA_PILIH) h+='<span class="tk-hint"><span class="link" onclick="setSisaPilih(SISA_PILIH)">tampilkan semua lagi</span></span>';
  tr.innerHTML=h;
  var pilih=SISA_PILIH?list.filter(function(r){return masukBucket(r,SISA_PILIH);}):list.slice();
  pilih.sort(function(a,b){return a.sisa-b.sisa;});
  var baris=function(r,ringan){
    return '<div class="tk-row'+(ringan?' ringan':'')+'" onclick="bukaDetail('+r.id+')">'
      +'<span class="tk-no mono">'+esc(r.nomor||'(kosong)')+'</span>'
      +pill(r.kategori)
      +'<span class="tk-sisa">'+sisaTxt(r)+'</span>'
      +'<span class="tk-pj">'+esc(r.penanggungjawab||'PJ belum diisi')+'</span>'
      +'<span class="tk-tgl">'+tglTxt(r)+'</span></div>';
  };
  var h2=pilih.map(function(r){return baris(r,0);}).join('');
  if(!SISA_PILIH){
    var nanti=DATA.dipantau.filter(function(r){return masukRange(r,'d30');}).sort(function(a,b){return a.sisa-b.sisa;}).slice(0,4);
    if(nanti.length) h2+='<div class="tk-sub">Berikutnya habis (8–30 hari)</div>'+nanti.map(function(r){return baris(r,1);}).join('');
  }
  lb.innerHTML=h2;
  el.style.display="";
  if(card) card.style.display="";
  samakanTinggi();
}
// ---- SEBARAN JATUH TEMPO: ringkasan aggregate, klik = nyaring tabel ----
var SB=[['d7','≤ 7 hari','#DC2626'],['d30','8–30 hari','#D97706'],['d60','31–60 hari','#CA8A04'],['d90','61–90 hari','#059669'],['belum','Belum diisi tanggal','#94A3B8']];
function sbLabel(k){ for(var i=0;i<SB.length;i++) if(SB[i][0]===k) return SB[i][1]; return k; }
function masukRange(r,k){
  if(k==='belum') return r.sisa===null;
  if(r.sisa===null||r.sisa<0) return false;
  if(k==='d7') return r.sisa<=7;
  if(k==='d30') return r.sisa>=8&&r.sisa<=30;
  if(k==='d60') return r.sisa>=31&&r.sisa<=60;
  if(k==='d90') return r.sisa>=61&&r.sisa<=90;
  return true;
}
function setBucket(k){ BUCKET=(BUCKET===k?'':k); SISA_PILIH=''; if(TAB_AKTIF!=='dash') gantiTab('dash'); renderList(); if(BUCKET) keTabel(); }
function renderSebaran(){
  var el=document.getElementById('sebaranBody'); if(!el) return;
  if(!DATA||!DATA.dipantau){ el.innerHTML='<div class="empty">Belum ada data.</div>'; return; }
  var max=1;
  var hit=SB.map(function(b){ var n=DATA.dipantau.filter(function(r){return masukRange(r,b[0]);}).length; if(n>max)max=n; return n; });
  el.innerHTML=SB.map(function(b,i){
    return '<div class="sb-row'+(BUCKET===b[0]?' on':'')+'" onclick="setBucket(\''+b[0]+'\')">'
      +'<span class="sb-lbl">'+b[1]+'</span><span class="sb-num">'+hit[i]+'</span>'
      +'<span class="sb-bar"><i style="width:'+Math.round(hit[i]/max*100)+'%;background:'+b[2]+'"></i></span></div>';
  }).join('')
  +'<div class="sb-foot">'+DATA.dipantau.length+' nomor dipantau · '+(DATA.hangus||[]).length+' sudah hangus</div>';
  samakanTinggi();
}
</script>
