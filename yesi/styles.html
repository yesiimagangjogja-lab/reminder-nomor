<style>

  .sysline.warn{border-left-color:#CA8A04;color:#7A5A00} .sysline.warn i.bi{color:#CA8A04}
  .sysline.off{border-left-color:#DC2626;color:#8A1C1C} .sysline.off i.bi{color:#DC2626}

  body.side-mini .sn-group{display:block}
  body.side-mini .sn-item{justify-content:center;padding:9px 0}
